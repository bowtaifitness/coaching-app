<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>YouTube Video</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000}
#player{position:absolute;top:0;left:0;width:100%;height:100%;border:0}
</style>
</head>
<body>
<iframe
  id="player"
  allowfullscreen
  allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
  referrerpolicy="strict-origin-when-cross-origin"
></iframe>
<script>
(function() {
  var urlParams = new URLSearchParams(window.location.search);
  var videoId = urlParams.get('v');
  if (!videoId) {
    document.body.innerHTML = '<div style="color:white;padding:20px;text-align:center;">Missing video ID</div>';
    return;
  }
  var embedParams = new URLSearchParams({
    playsinline: '1',
    rel: '0',
    modestbranding: '1',
    controls: '1',
    enablejsapi: '1',
    origin: window.location.origin
  });
  var embedUrl = 'https://www.youtube-nocookie.com/embed/' + encodeURIComponent(videoId) + '?' + embedParams.toString();
  document.getElementById('player').src = embedUrl;
})();
</script>
</body>
</html>
